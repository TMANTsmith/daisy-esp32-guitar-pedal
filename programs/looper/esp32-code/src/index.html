<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101116" />
    <title>Daisy Looper</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101116;
        --panel: #191b23;
        --panel2: #222530;
        --line: #343846;
        --text: #f2f3f7;
        --muted: #a2a7b5;
        --accent: #b69cff;
        --red: #ff647c;
        --green: #69dfa0;
        --yellow: #ffd36b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        padding: 26px 15px 40px;
        background: radial-gradient(ellipse at top, #242033 0%, var(--bg) 52%);
        color: var(--text);
        font:
          16px/1.45 system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      button {
        font: inherit;
        color: inherit;
        touch-action: manipulation;
      }
      .app {
        max-width: 720px;
        margin: auto;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }
      h1 {
        margin: 0;
        font-size: clamp(26px, 5vw, 36px);
        letter-spacing: -1.2px;
      }
      h2 {
        margin: 0;
        font-size: 17px;
      }
      .sub,
      .hint,
      .muted {
        color: var(--muted);
      }
      .sub {
        font-size: 14px;
        margin-top: 3px;
      }
      .connection {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 13px;
        white-space: nowrap;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--red);
        box-shadow: 0 0 12px #ff647c66;
      }
      .dot.on {
        background: var(--green);
        box-shadow: 0 0 12px #69dfa066;
      }
      .panel {
        background: linear-gradient(145deg, #1c1e27, #171921);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        margin: 14px 0;
        box-shadow: 0 12px 30px #0002;
      }
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 15px;
      }
      .hint {
        font-size: 12px;
      }
      .tracks {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }
      .track {
        min-width: 0;
        padding: 17px 8px;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #13151c;
        cursor: pointer;
      }
      .track.selected {
        border-color: var(--accent);
        background: #30283f;
        box-shadow: inset 0 0 0 1px var(--accent);
      }
      .track.recording .track-status {
        color: var(--red);
      }
      .track.recording .track-number:before {
        content: "● ";
        color: var(--red);
        font-size: 12px;
      }
      .track-number {
        display: block;
        font-size: 22px;
        font-weight: 800;
      }
      .track-status {
        display: block;
        margin-top: 5px;
        color: var(--muted);
        font-size: 12px;
      }
      .selected {
        color: inherit;
      }
      .selected-info {
        margin-top: 14px;
        color: var(--muted);
        font-size: 13px;
      }
      .selected-info strong {
        color: var(--accent);
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .action {
        position: relative;
        overflow: hidden;
        min-height: 82px;
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: #13151c;
        cursor: pointer;
        font-weight: 750;
      }
      .action:disabled,
      .mute:disabled {
        opacity: 0.42;
        cursor: not-allowed;
      }
      .action:active:not(:disabled),
      .mute:active:not(:disabled) {
        transform: scale(0.985);
      }
      .record {
        color: #ffdce2;
        border-color: #ff647c66;
        background: #42232d;
      }
      .record.active {
        color: var(--green);
        border-color: #69dfa088;
        background: #20382e;
      }
      .clear {
        color: var(--yellow);
        border-color: #ffd36b66;
      }
      .button-title {
        display: block;
        font-size: 16px;
      }
      .button-desc {
        display: block;
        margin-top: 5px;
        font-size: 12px;
        font-weight: 400;
        opacity: 0.8;
      }
      .progress {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 0;
        height: 4px;
        background: var(--yellow);
        pointer-events: none;
      }
      .mute-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .mute-desc {
        margin-top: 4px;
        color: var(--muted);
        font-size: 13px;
      }
      .mute {
        min-width: 112px;
        padding: 12px 18px;
        border: 1px solid var(--line);
        border-radius: 11px;
        background: #13151c;
        cursor: pointer;
        font-weight: 750;
      }
      .mute.muted {
        color: var(--accent);
        border-color: var(--accent);
        background: #30283f;
      }
      .log {
        max-height: 190px;
        overflow: auto;
        margin: 0;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #101116;
        color: #b8bdca;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font:
          12px/1.65 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
      }
      .text-button {
        border: 0;
        background: none;
        color: var(--muted);
        cursor: pointer;
        font-size: 12px;
      }
      .footer {
        text-align: center;
        margin-top: 20px;
        color: var(--muted);
        font-size: 12px;
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      @media (max-width: 480px) {
        body {
          padding: 20px 12px 32px;
        }
        .panel {
          padding: 16px;
        }
        .actions {
          grid-template-columns: 1fr;
        }
        .track {
          padding: 14px 5px;
        }
        .connection {
          font-size: 11px;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div>
          <h1>Daisy Looper</h1>
          <div class="sub">Wireless pedal controller</div>
        </div>
        <div class="connection">
          <span id="dot" class="dot"></span
          ><span id="connection">Connecting…</span>
        </div>
      </header>

      <section class="panel">
        <div class="panel-head">
          <h2>Tracks</h2>
          <span class="hint">3 independent tracks</span>
        </div>
        <div class="tracks" id="tracks">
          <button
            class="track selected"
            data-track="1"
            type="button"
            aria-pressed="true"
          >
            <span class="track-number">1</span
            ><span class="track-status">Idle</span>
          </button>
          <button
            class="track"
            data-track="2"
            type="button"
            aria-pressed="false"
          >
            <span class="track-number">2</span
            ><span class="track-status">Idle</span>
          </button>
          <button
            class="track"
            data-track="3"
            type="button"
            aria-pressed="false"
          >
            <span class="track-number">3</span
            ><span class="track-status">Idle</span>
          </button>
        </div>
        <div class="selected-info">
          Selected track: <strong id="selectedTrack">Track 1</strong>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Looper controls</h2>
          <span class="hint" id="recordHint">Ready</span>
        </div>
        <div class="actions">
          <button id="record" class="action record" type="button" disabled>
            <span class="button-title" id="recordTitle">● Record</span>
            <span class="button-desc" id="recordDesc"
              >Start recording this track</span
            >
          </button>
          <button id="clear" class="action clear" type="button" disabled>
            <span class="button-title">Clear track</span>
            <span class="button-desc" id="clearHint"
              >Press and hold for 1 second</span
            >
            <span id="progress" class="progress"></span>
          </button>
        </div>
      </section>

      <section class="panel">
        <div class="mute-row">
          <div>
            <h2>Output mute</h2>
            <div class="mute-desc" id="muteDesc">Audio output is unmuted</div>
          </div>
          <button id="mute" class="mute" type="button" disabled>Mute</button>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>Command log</h2>
          <button class="text-button" id="clearLog" type="button">
            Clear log
          </button>
        </div>
        <pre id="log" class="log">Waiting for ESP32 connection…</pre>
      </section>
      <div class="footer">Daisy Seed · ESP32 · WebSocket</div>
    </main>

    <script>
      "use strict";

      /*
       * Protocol used by the ESP32 firmware:
       *   Looper: { bytes: [packedState] }
       *   Muter:  "Mute" | "Unmute"
       *
       * UI track numbers 1–3 map to Daisy track numbers 0–2.
       * State layout: top two bits = mode, low bits = track index.
       */
      const MODE = { Idle: 0, Recording: 1, Clear: 2 };
      const WS_URL = `${location.protocol === "https:" ? "wss:" : "ws:"}//${location.host}/ws`;

      const $ = (id) => document.getElementById(id);
      const dot = $("dot"),
        connection = $("connection"),
        logEl = $("log");
      const recordBtn = $("record"),
        clearBtn = $("clear"),
        muteBtn = $("mute");
      let socket = null;
      let connected = false;
      let selectedTrack = 1;
      let muted = false;
      let reconnectTimer = null;
      const tracks = {
        1: { recording: false },
        2: { recording: false },
        3: { recording: false },
      };

      function log(message) {
        const stamp = new Date().toLocaleTimeString();
        if (logEl.textContent.startsWith("Waiting for")) logEl.textContent = "";
        const rows = (logEl.textContent + `[${stamp}] ${message}\n`)
          .trimEnd()
          .split("\n");
        logEl.textContent = rows.slice(-60).join("\n") + "\n";
        logEl.scrollTop = logEl.scrollHeight;
      }

      function setConnected(value) {
        connected = value;
        dot.classList.toggle("on", value);
        connection.textContent = value ? "Connected" : "Disconnected";
        recordBtn.disabled = clearBtn.disabled = muteBtn.disabled = !value;
        render();
      }

      function connect() {
        if (
          socket &&
          (socket.readyState === WebSocket.CONNECTING ||
            socket.readyState === WebSocket.OPEN)
        )
          return;
        connection.textContent = "Connecting…";
        log(`Connecting to ${WS_URL}`);
        try {
          const ws = new WebSocket(WS_URL);
          socket = ws;
          ws.addEventListener("open", () => {
            if (socket !== ws) return;
            setConnected(true);
            log("WebSocket connected");
          });
          ws.addEventListener("message", (event) =>
            log(`Received: ${String(event.data)}`),
          );
          ws.addEventListener("error", () => log("WebSocket error"));
          ws.addEventListener("close", () => {
            if (socket !== ws) return;
            setConnected(false);
            log("Connection closed; retrying in 2 seconds");
            clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(connect, 2000);
          });
        } catch (error) {
          setConnected(false);
          log(`Connection failed: ${error.message}`);
          clearTimeout(reconnectTimer);
          reconnectTimer = setTimeout(connect, 2000);
        }
      }

      function send(command, description) {
        if (!connected || !socket || socket.readyState !== WebSocket.OPEN) {
          log(`Not sent (disconnected): ${description}`);
          return false;
        }
        try {
          socket.send(JSON.stringify(command));
          log(`Sent: ${description}`);
          return true;
        } catch (error) {
          log(`Send failed: ${error.message}`);
          return false;
        }
      }

      function sendLooper(mode, trackNumber) {
        const zeroBasedTrack = trackNumber - 1;
        const packedState = (MODE[mode] << 6) | zeroBasedTrack;
        return send(
          { Looper: { bytes: [packedState] } },
          `Track ${trackNumber}: ${mode} (state ${packedState})`,
        );
      }

      function render() {
        document.querySelectorAll("[data-track]").forEach((button) => {
          const number = Number(button.dataset.track);
          const recording = tracks[number].recording;
          button.classList.toggle("selected", number === selectedTrack);
          button.classList.toggle("recording", recording);
          button.querySelector(".track-status").textContent = recording
            ? "Recording"
            : "Idle";
          button.setAttribute("aria-pressed", String(number === selectedTrack));
        });
        $("selectedTrack").textContent = `Track ${selectedTrack}`;
        const recording = tracks[selectedTrack].recording;
        recordBtn.classList.toggle("active", recording);
        $("recordTitle").textContent = recording ? "■ Stop" : "● Record";
        $("recordDesc").textContent = recording
          ? "Stop recording this track"
          : "Start recording this track";
        $("recordHint").textContent = recording
          ? `Track ${selectedTrack} is recording`
          : `Track ${selectedTrack} is idle`;
        muteBtn.textContent = muted ? "Unmute" : "Mute";
        muteBtn.classList.toggle("muted", muted);
        $("muteDesc").textContent = muted
          ? "Audio output is muted"
          : "Audio output is unmuted";
      }

      document.querySelectorAll("[data-track]").forEach((button) => {
        button.addEventListener("click", () => {
          selectedTrack = Number(button.dataset.track);
          render();
          log(`Selected Track ${selectedTrack}`);
        });
      });

      recordBtn.addEventListener("click", () => {
        if (!connected) return;
        const track = tracks[selectedTrack];
        const mode = track.recording ? "Idle" : "Recording";
        if (sendLooper(mode, selectedTrack)) {
          track.recording = !track.recording;
          render();
        }
      });

      // Clear only fires after a continuous one-second press; works with mouse and touch.
      let holdStart = 0,
        holdPointer = null,
        holdTimer = null,
        animation = 0,
        clearSent = false;
      function resetClearHold() {
        if (holdTimer) clearTimeout(holdTimer);
        if (animation) cancelAnimationFrame(animation);
        holdTimer = animation = null;
        holdStart = 0;
        holdPointer = null;
        $("progress").style.width = "0%";
        if (!clearSent)
          $("clearHint").textContent = "Press and hold for 1 second";
      }
      function animateProgress() {
        if (!holdStart || clearSent) return;
        const pct = Math.min(100, (performance.now() - holdStart) / 10);
        $("progress").style.width = `${pct}%`;
        if (pct < 100) animation = requestAnimationFrame(animateProgress);
      }
      clearBtn.addEventListener("pointerdown", (event) => {
        if (!connected || holdPointer !== null) return;
        event.preventDefault();
        holdPointer = event.pointerId;
        holdStart = performance.now();
        clearSent = false;
        try {
          clearBtn.setPointerCapture(event.pointerId);
        } catch (_) {}
        $("clearHint").textContent = "Keep holding…";
        animation = requestAnimationFrame(animateProgress);
        holdTimer = setTimeout(() => {
          if (sendLooper("Clear", selectedTrack)) {
            tracks[selectedTrack].recording = false;
            clearSent = true;
            $("clearHint").textContent = `Track ${selectedTrack} cleared`;
            log(`Track ${selectedTrack} cleared`);
            render();
          } else {
            $("clearHint").textContent = "Command not sent";
          }
          $("progress").style.width = "100%";
          if (animation) cancelAnimationFrame(animation);
          animation = 0;
          holdTimer = null;
        }, 1000);
      });
      function finishClear(event) {
        if (holdPointer === null) return;
        if (
          event &&
          event.pointerId !== undefined &&
          event.pointerId !== holdPointer
        )
          return;
        const didClear = clearSent;
        resetClearHold();
        if (!didClear) log("Clear cancelled — held for less than 1 second");
        clearSent = false;
      }
      ["pointerup", "pointercancel", "lostpointercapture"].forEach((name) =>
        clearBtn.addEventListener(name, finishClear),
      );

      muteBtn.addEventListener("click", () => {
        const nextMuted = !muted;
        const command = { Muter: nextMuted ? "Mute" : "Unmute" };
        if (send(command, nextMuted ? "Mute" : "Unmute")) {
          muted = nextMuted;
          render();
        }
      });
      $("clearLog").addEventListener("click", () => {
        logEl.textContent = "";
      });

      render();
      setConnected(false);
      connect();
    </script>
  </body>
</html>
